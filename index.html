kground-color: #fafafa;}.price-table .category-row {background-color: #f1f1f3;font-weight: 700;color: var(--dark-color);font-size: 17px;border-left: 4px solid var(--primary-color);}.price-table .price-val {font-weight: 700;color: var(--primary-color);text-align: right;white-space: nowrap;}.price-note {text-align: center;margin-top: 35px;font-size: 14px;color: #777;max-width: 800px;margin-left: auto;margin-right: auto;}.steps-grid {display: grid;grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));gap: 35px;max-width: 1200px;margin: 0 auto;}.step-item {position: relative;padding: 40px 30px;background: var(--gray-bg);border-top: 4px solid var(--primary-color);transition: 0.3s;}.step-item:hover {background: #fff;box-shadow: 0 10px 30px rgba(0,0,0,0.05);}.step-num {font-size: 46px;font-weight: 800;color: rgba(140, 37, 37, 0.15);position: absolute;top: 15px;right: 25px;}.step-item h3 {margin: 0 0 15px 0;font-size: 22px;font-weight: 600;color: var(--dark-color);}.step-item p {margin: 0;font-size: 15px;color: #555;line-height: 1.6;}.why-us {background: linear-gradient(rgba(17,17,17,0.96), rgba(17,17,17,0.96)), url('picsum.photos') no-repeat center/cover;color: #fff;}.why-us-grid {display: grid;grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));gap: 50px;max-width: 1200px;margin: 0 auto;}.why-us-item h3 {color: var(--accent-gold);font-size: 24px;margin-top: 0;margin-bottom: 20px;font-weight: 500;border-left: 3px solid var(--primary-color);padding-left: 15px;}.why-us-item p {color: #ccc;font-size: 16px;line-height: 1.7;margin: 0;}.faq-container {max-width: 900px;margin: 0 auto;}.faq-item {border-bottom: 1px solid var(--border-color);padding: 30px 0;}.faq-item:first-child {padding-top: 0;}.faq-item:last-child {border-bottom: none;padding-bottom: 0;}.faq-item h3 {margin: 0 0 15px 0;font-size: 21px;font-weight: 500;color: var(--dark-color);}.faq-item p {margin: 0;font-size: 16px;color: #555;line-height: 1.7;}.about-section {background-color: var(--gray-bg);text-align: center;}.about-content {max-width: 950px;margin: 0 auto;}.about-content p {font-size: 18px;line-height: 1.8;color: #444;margin: 0;font-weight: 300;}footer {background-color: var(--dark-color);color: #aaa;padding: 70px 5% 40px;font-size: 14px;border-top: 5px solid var(--primary-color);}.footer-grid {display: grid;grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));gap: 50px;margin-bottom: 50px;}.footer-grid h4 {color: #fff;margin-top: 0;margin-bottom: 25px;font-size: 18px;font-weight: 600;letter-spacing: 0.5px;}.footer-grid p, .footer-grid a {color: #aaa;text-decoration: none;margin: 10px 0;display: block;font-size: 15px;}.footer-grid a:hover {color: #fff;}.footer-bottom {border-top: 1px solid #222;padding-top: 30px;text-align: center;font-size: 13px;color: #666;}</head><body><header><a href="index.html" class="logo">MIELE<span>•ZENTRUM</span></a><div class="header-contacts"><a href="tel:+79868311588">+7 (986) 831-15-88</a><div class="header-info">Прием заявок: ежедневно 10:00 - 20:00</div></header><nav><a href="index.html" class="active">Главная</a><a href="warranty.html">Условия гарантии</a><a href="news.html">Новости и статьи</a></nav><section class="hero"><h1>Специализированный инженерный ремонт Miele в СПб</h1><p>Ремонт бытовой техники премиум-класса на дому у клиента. Восстановление электроники любой сложности, оригинальные комплектующие и выезд инженера в день обращения во все районы Санкт-Петербурга.</p><a href="tel:+79868311588" class="btn">Вызвать старшего инженера</a></section><section class="container"><h2 class="section-title">Обслуживаемая техника Miele</h2><p class="section-subtitle">Мы специализируемся на узкопрофильном ремонте сложных узлов немецкой техники, обеспечивая заводские стандарты качества без транспортировки крупногабаритных приборов в мастерскую.</p><div class="services-grid"><div class="service-card"><img src="picsum.photos" alt="Ремонт стиральных машин Miele"><div class="service-card-content"><h3>Стиральные машины</h3><div class="price">от 1 500 руб.</div><p>Профессиональное устранение программных сбоев плат управления Softtronic, замена изношенных подшипников бака, ТЭНов, оригинальных помп и восстановление систем герметичности Waterproof.</p><a href="tel:+79868311588" class="btn">Заказать выезд мастера</a></div></div><div class="service-card"><img src="picsum.photos" alt="Ремонт посудомоечных машин Miele"><div class="service-card-content"><h3>Посудомоечные машины</h3><div class="price">от 1 600 руб.</div><p>Комплексная диагностика гидравлической системы, ликвидация протечек, замена циркуляционных насосов со встроенными проточными нагревателями, ремонт замков ComfortClose и систем сушки.</p><a href="tel:+79868311588" class="btn">Заказать выезд мастера</a></div></div><div class="service-card"><img src="picsum.photos" alt="Ремонт кофемашин Miele"><div class="service-card-content"><h3>Встраиваемые кофемашины</h3><div class="price">от 1 200 руб.</div><p>Техническое обслуживание блоков заваривания AromaticSystem, замена мультиклапанов и уплотнителей высокого давления, профессиональный ремонт кофемолок и плат управления кофемашин.</p><a href="tel:+79868311588" class="btn">Заказать выезд мастера</a></div></div></div></section><section class="container price-section"><h2 class="section-title">Тарифы на ремонт и диагностику</h2><p class="section-subtitle">Цены указаны за работу специалиста без учета стоимости запчастей. При выполнении ремонта инженером нашего центра, полная диагностика техники Miele всегда составляет 0 рублей.</p><div class="price-table-wrapper"><table class="price-table"><thead><tr><th>Тип неисправности / Вид работы</th><th style="text-align: right;">Стоимость</th></tr></thead><tbody><tr class="category-row"><td colspan="2">Стиральные и сушильные машины Miele</td></tr><tr><td>Машина не сливает воду / очистка системы циркуляции</td><td class="price-val">от 1 500 руб.</td></tr><tr><td>Не нагревает воду / замена оригинального ТЭна повышенной прочности</td><td class="price-val">от 1 800 руб.</td></tr><tr><td>Сильный гул, вибрация или скрежет при отжиме (замена подшипников бака)</td><td class="price-val">от 3 500 руб.</td></tr><tr><td>Мигают индикаторы, сбой программ (ремонт и пайка электронного модуля)</td><td class="price-val">от 2 400 руб.</td></tr><tr><td>Замена блокировки люка (УБЛ) / ремонт замка дверцы</td><td class="price-val">от 1 300 руб.</td></tr><tr class="category-row"><td colspan="2">Посудомоечные машины Miele</td></tr><tr><td>Горит ошибка Waterproof / Срабатывание защиты от протечек в поддон</td><td class="price-val">от 1 600 руб.</td></tr><tr><td>Посуда остается грязной, нет давления воды (ремонт циркуляционной помпы)</td><td class="price-val">от 2 800 руб.</td></tr><tr><td>Не сушит посуду после мойки (замена вентилятора сушки / термодатчика)</td><td class="price-val">от 1 900 руб.</td></tr><tr><td>Не набирает воду / блокировка впускного клапана куба фильтрации</td><td class="price-val">от 1 500 руб.</td></tr><tr class="category-row"><td colspan="2">Встраиваемые кофемашины Miele</td></tr><tr><td>Кофе течет в поддон / не формируется капсула (переборка заварного блока)</td><td class="price-val">от 1 500 руб.</td></tr><tr><td>Не мелет кофейные зерна / блокировка или износ ножей кофемолки</td><td class="price-val">от 2 200 руб.</td></tr><tr><td>Не подает пар или горячую воду (декальцинация бойлера, замена мультиклапана)</td><td class="price-val">от 1 200 руб.</td></tr></tbody></table></div><div class="price-note">*При отказе от проведения ремонтных работ стоимость комплексной диагностики системы на дому составляет от 1000 рублей в зависимости от модели и архитектуры конкретного устройства.lt;/div></section><section class="container"><h2 class="section-title">Порядок взаимодействия и этапы работы</h2><p class="section-subtitle">Мы разработали прозрачную и понятную схему обслуживания премиальной техники Miele, чтобы вы полностью контролировали каждый шаг инженера в процессе ремонта.</p><div class="steps-grid"><div class="step-item"><div class="step-num">01</div><h3>Заявка и консультация</h3><p>Вы звоните нам или оставляете запрос. По симптомам поломки наш ведущий инженер проводит первичный разбор и называет ориентировочную стоимость.</p></div><div class="step-item"><div class="step-num">02</div><h3>Выезд и диагностика</h3><p>Мастер приезжает строго в согласованное время со всем диагностическим оборудованием и набором оригинальных деталей Miele под вашу модель.</p></div><div class="step-item"><div class="step-num">03</div><h3>Согласование и ремонт</h3><p>Проводится детальный разбор прибора. Мастер озвучивает итоговую точную стоимость. Ремонт выполняется на месте без скрытых наценок.</p></div><div class="step-item"><div class="step-num">04</div><h3>Тест и гарантия до 5 лет</h3><p>Прибор тестируется во всех рабочих режимах. Вы принимаете полностью готовую работу, после чего мастер выписывает официальный гарантийный бланк.</p></div></div></section><section class="container why-us"><h2 class="section-title" style="color: #fff;">Почему доверяют нашему инженерному центру</h2><p class="section-subtitle" style="color: #ccc;">Ремонт премиального оборудования Miele не прощает ошибок мастеров-универсалов. Наш подход основан на жестких немецких регламентах.</p><div class="why-us-grid"><div class="why-us-item"><h3>Узкая специализация</h3><p>Мы не ремонтируем всё подряд. Все наши специалисты ежегодно проходят переподготовку именно по стандартам Miele, зная архитектуру плат до мельчайших нюансов.</p></div><div class="why-us-item"><h3>Собственный склад в СПб</h3><p>Вам не придется ждать деталь неделями. На нашем виртуальном складе на Васильевском острове всегда в наличии оригинальные комплектующие для моделей любого года выпуска.</p></div><div class="why-us-item"><h3>Сохранение интерьера</h3><p>Ремонт встроенной премиум-техники требует ювелирной точности. Мы аккуратно извлекаем приборы из кухонных гарнитуров без повреждения фасадов, полов и столешниц.</p></div></div></section><section class="container"><h2 class="section-title">Часто задаваемые вопросы клиентов (FAQ)</h2><p class="section-subtitle">Отвечаем честно, открыто и развернуто на самые популярные вопросы владельцев техники Miele в Санкт-Петербурге.</p><div class="faq-container"><div class="faq-item"><h3>Выезжаете ли вы за пределы КАД по Ленинградской области?</h3><p>Да, наши инженеры выезжают во все пригороды Санкт-Петербурга (Пушкин, Павловск, Петергоф, Сестрорецк, Всеволожск, Колпино и т.д.). Условия выезда, точное время и финальная стоимость транспортных расходов согласуются в индивидуальном порядке на этапе оформления первичной заявки по телефону.</p><div class="faq-item"><h3>Сколько по времени занимает стандартный ремонт техники на дому?</h3><p>В 90% случаев ремонт любой сложности (включая замену ТЭНов, сливных насосов, клапанов или пайку электронных плат управления) выполняется за один визит мастера и занимает от 40 минут до 2 часов. Капитальный ремонт с заменой подшипников бака стиральной машины может занять около 3 часов в силу необходимости полного разбора корпуса.</p><div class="faq-item"><h3>Могу ли я лично присутствовать при процессе ремонта моей техники?</h3><p>Безусловно. Мы ведем абсолютно прозрачную деятельность и не скрываем процессы работы от клиентов. Инженер наглядно продемонстрирует вам точную причину поломки, покажет дефектный узел и распакует новую оригинальную деталь Miele прямо при вас перед ее установкой в прибор.</p><div class="faq-item"><h3>Что делать, если техника сломается снова во время действия гарантии?</h3><p>Вам достаточно связаться с нами по телефону. Мы фиксируем все выданные гарантийные талоны в нашей единой электронной базе данных. Повторный выезд инженера и полное устранение возникшего дефекта по гарантии осуществляются вне очереди и абсолютно бесплатно для вас.</p></div></section><section class="container about-section"><div class="about-content"><h2 class="section-title">О специализированном сервисе</h2><p>Мы являемся независимой службой инженеров, специализирующихся исключительно на техническом обслуживании и ремонте бытового оборудования марки Miele в Санкт-Петербурге. Наша ключевая особенность — проведение всех манипуляций непосредственно на месте у заказчика. Премиальная техника требует бережного обращения, поэтому мы полностью исключили этап транспортировки приборов, проводя сложнейший компонентный ремонт плат и узлов прямо у вас дома.</p></div></section><footer><div class="footer-grid"><div><h4>MIELE ZENTRUM</h4><p>Независимый специализированный сервис по ремонту и обслуживанию бытовой техники Miele в Санкт-Петербурге и Ленинградской области.</p></div><div><h4>Навигация по сайту</h4><a href="index.html">Главная страница</a><a href="warranty.html">Условия расширенной гарантии</a><a href="news.html">Полезные статьи и новости</a></div><div><h4>Контакты и локация</h4><p>Телефон: +7 (986) 831-15-88</p><p>Email: miele.zentrum.service@gmail.com</p><p>Адрес офиса: г. Санкт-Петербург, В.О., Малый проспект, д. 54</p><p>График работы: Ежедневно 10:00 - 20:00</p></div></div><div class="footer-bottom">© 2026 Специализированный сервисный центр Miele. Все упоминаемые товарные знаки и бренды принадлежат их законным правообладателям. Сервис является полностью независимым и не имеет прямого отношения к официальным заводам-изготовителям. Информация на сайте не является публичной офертой.</div></footer></body></html>
